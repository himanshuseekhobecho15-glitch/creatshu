<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg-dark: #0a0a12;
  --bg-gradient: radial-gradient(ellipse at 30% 50%, #0d0d22 0%, #000010 60%);
  --accent: #00c8d4;
  --text-light: rgba(255,255,255,0.8);
  --text-dim: rgba(255,255,255,0.5);
}

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background: var(--bg-dark);
  overflow-x: hidden;
}

/* HERO */
.hero {
  position: relative;
  height: 100vh;
  min-height: 560px;
  overflow: hidden;
}

/* BACKGROUND */
.hero-bg {
  position: absolute;
  inset: 0;
  background: var(--bg-gradient);
  z-index: 0;
}

/* IMAGE */
.hero-image {
  position: absolute;
  right: 0;
  top: 0;
  width: 55%;
  height: 100%;
  object-fit: cover;
  opacity: 0.9;
  z-index: 1;

  mask-image: linear-gradient(to left, #000 40%, transparent);
  -webkit-mask-image: linear-gradient(to left, #000 40%, transparent);
}

/* GLOW */
.glow {
  position: absolute;
  right: 10%;
  top: 50%;
  transform: translateY(-50%);
  width: 400px;
  height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,200,212,0.2), transparent 70%);
}

/* PARTICLES */
.particle {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,210,100,0.6);
  animation: floatUp linear infinite;
  will-change: transform, opacity;
}

@keyframes floatUp {
  from { transform: translateY(0); opacity: 0.7; }
  to { transform: translateY(-100vh) scale(0.2); opacity: 0; }
}

/* NAV */
nav {
  position: absolute;
  top: 0;
  width: 100%;
  padding: 22px 48px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
}

.nav-links {
  display: flex;
  gap: 32px;
  list-style: none;
}

.nav-links a {
  text-decoration: none;
  color: var(--text-light);
  font-size: 12px;
  letter-spacing: 1.5px;
  transition: 0.2s;
}

.nav-links a:hover,
.nav-links a.active {
  color: #fff;
  border-bottom: 1px solid #fff;
}

/* CONTENT */
.hero-content {
  position: absolute;
  left: 48px;
  top: 50%;
  transform: translateY(-50%);
  max-width: 550px;
  z-index: 5;
}

.tagline {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 16px;
}

.headline {
  font-size: clamp(48px, 6vw, 80px);
  font-weight: 800;
  line-height: 1;
}

.headline span {
  color: var(--accent);
}

/* BUTTONS */
.cta-row {
  margin-top: 36px;
  display: flex;
  gap: 16px;
}

.btn {
  padding: 14px 28px;
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
}

.btn-primary {
  background: var(--accent);
  border: none;
  color: #000;
}

.btn-secondary {
  border: 1px solid rgba(255,255,255,0.3);
  background: transparent;
  color: var(--text-light);
}

/* FOOTER BAR */
.bottom-bar {
  position: absolute;
  bottom: 30px;
  left: 48px;
  right: 48px;
  display: flex;
  justify-content: space-between;
}

.stat {
  font-size: 10px;
  color: var(--text-dim);
}

.stat span {
  display: block;
  font-size: 22px;
  color: #fff;
}
</style>
</head>

<body>

<section class="hero">

  <div class="hero-bg"></div>
  <div class="glow"></div>

  <!-- IMAGE -->
  <img class="hero-image" src="your-image.jpg" alt="Hero Image">

  <!-- NAV -->
  <nav>
    <h3 style="color:white;">Broadway</h3>

    <ul class="nav-links">
      <li><a href="#">Solutions</a></li>
      <li><a class="active" href="#">About</a></li>
      <li><a href="#">Careers</a></li>
    </ul>
  </nav>

  <!-- CONTENT -->
  <div class="hero-content">
    <p class="tagline">Fastest way to launch</p>

    <h1 class="headline">
      Launch.<br>
      Manage.<br>
      Lead your <span>casino.</span>
    </h1>

    <div class="cta-row">
      <button class="btn btn-primary">Get Started</button>
      <button class="btn btn-secondary">Learn More</button>
    </div>
  </div>

  <!-- STATS -->
  <div class="bottom-bar">
    <div class="stat"><span>200+</span>Clients</div>
    <div class="stat"><span>15+</span>Years</div>
    <div class="stat"><span>50+</span>Countries</div>
  </div>

</section>

</body>
</html>
