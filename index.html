<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #0a0a12; overflow-x: hidden; }

  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 560px;
    overflow: hidden;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 50%, #0d0d22 0%, #000010 60%);
    z-index: 0;
  }

  .hero-image {
    position: absolute;
    right: 0;
    top: 0;
    height: 100%;
    width: 55%;
    object-fit: cover;
    object-position: center top;
    z-index: 1;
    mask-image: linear-gradient(to left, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
    -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
    opacity: 0.92;
  }

  /* Teal glow behind image */
  .glow {
    position: absolute;
    right: 10%;
    top: 50%;
    transform: translateY(-50%);
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,180,180,0.18) 0%, transparent 70%);
    z-index: 0;
    pointer-events: none;
  }

  /* Floating particles */
  .particle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,210,100,0.55);
    animation: floatUp linear infinite;
    z-index: 2;
    pointer-events: none;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) scale(1); opacity: 0.7; }
    100% { transform: translateY(-100vh) scale(0.2); opacity: 0; }
  }

  /* NAV */
  nav {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 48px;
    z-index: 10;
  }

  .logo {
    display: flex;
    flex-direction: column;
    line-height: 1;
  }
  .logo-icon {
    width: 28px;
    height: 28px;
    margin-bottom: 2px;
  }
  .logo-name {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #ffffff;
    text-transform: uppercase;
  }
  .logo-sub {
    font-size: 8px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
  }

  .nav-links {
    display: flex;
    gap: 36px;
    list-style: none;
  }
  .nav-links a {
    color: rgba(255,255,255,0.75);
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    transition: color 0.2s;
    cursor: pointer;
  }
  .nav-links a:hover, .nav-links a.active { color: #fff; border-bottom: 1px solid #fff; padding-bottom: 2px; }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .lang-btn {
    background: none;
    border: none;
    color: rgba(255,255,255,0.7);
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
  }

  /* CONTENT */
  .hero-content {
    position: absolute;
    left: 48px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 5;
    max-width: 560px;
  }

  .tagline {
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .headline {
    font-size: clamp(52px, 6vw, 82px);
    font-weight: 800;
    line-height: 1.0;
    color: #ffffff;
    letter-spacing: -1px;
    margin-bottom: 0;
  }

  .headline-accent {
    color: #00c8d4;
    display: block;
  }

  .cta-row {
    margin-top: 40px;
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .btn-primary {
    background: #00c8d4;
    color: #000;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: none;
    padding: 14px 32px;
    cursor: pointer;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    transition: opacity 0.2s;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-secondary {
    background: none;
    border: 1px solid rgba(255,255,255,0.3);
    color: rgba(255,255,255,0.8);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 13px 28px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-secondary:hover { border-color: #fff; color: #fff; }

  /* Bottom bar */
  .bottom-bar {
    position: absolute;
    bottom: 28px;
    left: 48px;
    right: 48px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    z-index: 5;
  }
  .stat { color: rgba(255,255,255,0.4); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; }
  .stat span { display: block; font-size: 22px; font-weight: 700; color: rgba(255,255,255,0.85); margin-bottom: 3px; }

  .scroll-hint {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: rgba(255,255,255,0.3);
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .scroll-line {
    width: 1px;
    height: 36px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.4), transparent);
    animation: scrollPulse 1.8s ease-in-out infinite;
  }
  @keyframes scrollPulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
<section class="hero">
  <div class="hero-bg"></div>
  <div class="glow"></div>

  <!-- Krishna image -->
  <img class="hero-image" src="Krishna.webp"
  <!-- Floating particles -->
  <div class="particle" style="width:3px;height:3px;left:12%;animation-duration:8s;animation-delay:0s;top:90%"></div>
  <div class="particle" style="width:2px;height:2px;left:18%;animation-duration:11s;animation-delay:2s;top:85%"></div>
  <div class="particle" style="width:4px;height:4px;left:25%;animation-duration:9s;animation-delay:1s;top:95%"></div>
  <div class="particle" style="width:2px;height:2px;left:8%;animation-duration:13s;animation-delay:3s;top:88%"></div>
  <div class="particle" style="width:3px;height:3px;left:35%;animation-duration:7s;animation-delay:0.5s;top:92%"></div>
  <div class="particle" style="background:rgba(0,200,212,0.5);width:2px;height:2px;left:42%;animation-duration:10s;animation-delay:4s;top:87%"></div>

  <!-- Nav -->
  <nav>
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 28 28" fill="none">
        <path d="M14 2L3 8v12l11 6 11-6V8L14 2z" fill="none" stroke="#00c8d4" stroke-width="1.5"/>
        <path d="M14 2v24M3 8l11 6 11-6" stroke="#00c8d4" stroke-width="1.5"/>
      </svg>
      <span class="logo-name">Creatshu</span>
      <span class="logo-sub">Studio</span>
    </div>

    <ul class="nav-links">
      <li><a href="#">Art Station</a></li>
      <li><a href="#" class="active">About Us</a></li>
      <li><a href="#">Careers</a></li>
      <li><a href="#">Blog</a></li>
      <li><a href="#">Contact Us</a></li>
    </ul>

    <div class="nav-right">
      <button class="lang-btn">EN ▾</button>
    </div>
  </nav>

  <!-- Main content -->
  <div class="hero-content">
    <p class="tagline">India's AAA Studio.</p>
    <h1 class="headline">
      COMING.<br>
      SOON.<br>
      Stay Tune<br>
      <span class="headline-accent"> India's AAA Studio.</span>
    </h1>
    <div class="cta-row">
      <button class="btn-primary">Visited</button>
      <button class="btn-secondary">Learn More</button>
    </div>
  </div>

  <!-- Bottom bar -->
  <div class="bottom-bar">
    <div style="display:flex;gap:40px;">
      <div class="stat"><span>200+</span>Project</div>
      <div class="stat"><span>15+</span>Years experience</div>
      <div class="stat"><span>50+</span>Countries</div>
    </div>
    <div class="scroll-hint">
      <div class="scroll-line"></div>
      Scroll
    </div>
  </div>
</section>
</body>
</html>
